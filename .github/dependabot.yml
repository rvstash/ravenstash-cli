version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packaging/installer-worker
    schedule:
      interval: weekly
    groups:
      installer-worker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /packaging
    schedule:
      interval: weekly
    ignore:
      # Ubuntu 20.04 is the oldest supported runtime: only its digest may move.
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # The uv version changes in every workflow and this image together.
      - dependency-name: astral-sh/uv
